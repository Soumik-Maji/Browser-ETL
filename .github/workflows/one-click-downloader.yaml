name: Release Downloader Script

on:
  push:
    branches:
      - main

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Project zip
        run: |
          mkdir build
          cp downloader.sh build/
          cd build
          printf 'yBrowser-ETL\nn' | bash ./downloader.sh
          zip -r ../Browser-ETL.zip Browser-ETL

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Release
          files: |
            downloader.sh
            Browser-ETL.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep latest release only
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 1
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}